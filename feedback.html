<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feedback | VICOHI</title>

<!-- SEO META -->
<meta name="description" content="Share your feedback, suggestions, or experience about VICOHI tools. Help us improve our online productivity platform.">
<meta name="keywords" content="vicohi feedback, contact vicohi, user feedback, suggestions, report issue">
<meta name="robots" content="index, follow">

<link rel="canonical" href="https://vicohi.com/feedback.html">

<!-- Open Graph -->
<meta property="og:title" content="Feedback | VICOHI">
<meta property="og:description" content="Share your feedback and help improve VICOHI tools and services.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://vicohi.com/feedback.html">
<meta property="og:image" content="https://vicohi.com/favicon.png">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Feedback | VICOHI">
<meta name="twitter:description" content="Send your feedback and suggestions to improve VICOHI tools.">
<meta name="twitter:image" content="https://vicohi.com/favicon.png">

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- CSS -->
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="feedback.css">
<link rel="stylesheet" href="components/navbar.css">

<!-- Favicon -->
<link rel="icon" href="favicon.png">

</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- FEEDBACK SECTION -->
<section class="feedback-section" id="feedback">

  <div class="feedback-container">

    <h2>We Value Your Feedback</h2>

    <p>
      Help us improve VICOHI by sharing your experience,
      suggestions, ideas, or reporting any issues you encounter.
    </p>

    <!-- FEEDBACK FORM -->
    <form class="feedback-form" id="feedbackForm">

      <input
        type="text"
        id="name"
        placeholder="Your Name"
        required
      >

      <input
        type="email"
        id="email"
        placeholder="Your Email"
        required
      >

      <textarea
        id="message"
        placeholder="Write your feedback..."
        rows="6"
        required
      ></textarea>

      <button type="submit">
        Submit Feedback
      </button>

    </form>

  </div>

</section>

<!-- FOOTER -->
<div id="footer"></div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<!-- PROJECT SCRIPTS -->
<script src="firebase-config.js"></script>
<script src="js/common.js"></script>
<script src="feedback.js"></script>

</body>
</html>
